# Sticky Actions & Protected Rows (Template 6)
org.joget.marketplace.customdatalist.template6.config = Sticky Actions & Protected Rows Configuration
org.joget.marketplace.customdatalist.template6.protectedRowsConditionGrid = Protected Rows (Disable Selection)
org.joget.marketplace.customdatalist.template6.protectedRowsConditionGrid.desc = Define multiple conditions. Rows matching any condition (column value equals the given value) will have their selection checkbox disabled and cannot be selected for bulk actions.
org.joget.marketplace.customdatalist.template6.conditionColumnId = Column ID
org.joget.marketplace.customdatalist.template6.conditionColumnId.desc = Select the column ID to check (e.g. username, role).
org.joget.marketplace.customdatalist.template6.conditionValue = Value
org.joget.marketplace.customdatalist.template6.conditionValue.desc = Enter the exact value to match (case-sensitive). Rows with this value in the column above cannot be selected.
org.joget.marketplace.customdatalist.template6.hideActionsWhenUnselected = Hide Actions When No Row Selected
org.joget.marketplace.customdatalist.template6.hideActionsWhenUnselected.desc = When enabled, action buttons are hidden until the required row(s) are selected. When disabled, action buttons stay visible but inactive until selection.
